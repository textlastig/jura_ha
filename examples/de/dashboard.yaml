        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_tray
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_tray
      name: Restwasserschale fehlt
      icon: mdi:tray
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_tray
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_coffee_bin
      name: Kaffeesatzbehälter fehlt
      icon: mdi:delete-empty
      color: red
      vertical: false
      visibility:
      - condition: state
