###############################################################################
# examples/de/dashboard.yaml
# Dashboard "Kaffeemaschine" für eine JURA WE6 mit textlastig/jura_ha.
# Home-Assistant-Sprache: Deutsch (Produktnamen müssen zur Produktauswahl
# der Integration passen).
#
# 1. jura_ha und die Karte apexcharts-card installieren (HACS/Marketplace).
# 2. Zuerst examples/de/package.yaml ausrollen (Tageszähler, Skript).
# 3. Jedes "jura_we6_xxxxxxxxxxxx" durch das eigene Entitäts-Präfix ersetzen,
#    z. B. jura_we6_d0123456789a (Einstellungen → Entitäten, Suche "jura").
# 4. Einstellungen → Dashboards → Dashboard hinzufügen → "Neu von Grund auf",
#    öffnen → Bearbeiten → ⋮ → Raw-Konfigurationseditor, Datei einfügen,
#    speichern.
# Andere Maschinen: Kacheln für nicht vorhandene Produkte entfernen.
###############################################################################

title: Kaffeemaschine
views:
- title: Jura WE6
  path: we6
  icon: mdi:coffee-maker
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: binary_sensor.jura_we6_xxxxxxxxxxxx_connection
    name: Bluetooth
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.jura_we6_xxxxxxxxxxxx_total_product
    name: Gerät
    show_name: true
    show_state: false
    show_icon: true
    icon: mdi:coffee-maker-outline
    tap_action:
      action: more-info
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Meldungen
      icon: mdi:bell-outline
      heading_style: title
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_fill_water
      name: Wassertank füllen
      icon: mdi:water-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_fill_water
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_no_beans
      name: Bohnen füllen
      icon: mdi:coffee-off
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_no_beans
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_grounds
      name: Kaffeesatzbehälter leeren
      icon: mdi:delete-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_grounds
        state: 'on'
      hide_state: true
    - grid_options:
