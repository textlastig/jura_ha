    - grid_options:
        columns: 12
      type: tile
      entity: button.jura_we6_xxxxxxxxxxxx_make
      name: Zubereiten
      icon: mdi:play-circle-outline
      color: green
      hide_state: true
      tap_action: &id001
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jura_we6_xxxxxxxxxxxx_make
        confirmation:
          text: Jetzt zubereiten?
      icon_tap_action: *id001
      visibility:
