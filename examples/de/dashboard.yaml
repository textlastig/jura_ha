  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bezüge pro Tag
      icon: mdi:chart-bar
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      all_series_config:
        curve: stepline
        stroke_width: 2
        unit: Bezüge
        extend_to: now
        transform: 'return Number(x) > 0 ? Number(x) : null;'
        show:
          legend_value: false
      apex_config:
        chart:
          height: 320
        markers:
          size: 5
        legend:
          position: bottom
        yaxis:
          min: 0
          forceNiceScale: true
          decimalsInFloat: 0
      header:
        show: true
        title: Heute
        show_states: false
      graph_span: 1d
      span:
        start: day
      series:
      - entity: sensor.jura_we6_kaffee_spezial_heute
        name: Kaffee Spezial
      - entity: sensor.jura_we6_kaffee_heute
        name: Kaffee
      - entity: sensor.jura_we6_espresso_heute
        name: Espresso
