        name: 2 x Espresso
      - entity: sensor.jura_we6_2_x_ristretto_heute
        name: 2 x Ristretto
      - entity: sensor.jura_we6_heisswasser_heute
        name: Heißwasser
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      all_series_config:
        curve: stepline
        stroke_width: 2
        unit: Bezüge
        extend_to: false
        transform: 'return Number(x) > 0 ? Number(x) : null;'
        show:
          legend_value: false
      apex_config:
        chart:
          height: 320
        markers:
          size: 5
        legend:
          position: bottom
        yaxis:
          min: 0
          forceNiceScale: true
          decimalsInFloat: 0
        xaxis:
          tickAmount: 7
      header:
        show: true
        title: Letzte 7 Tage
        show_states: false
      graph_span: 7d
      span:
        start: day
        offset: -6d
      series:
      - entity: sensor.jura_we6_kaffee_spezial_heute
        name: Kaffee Spezial
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_kaffee_heute
        name: Kaffee
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_espresso_heute
        name: Espresso
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_ristretto_heute
        name: Ristretto
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_kaffee_heute
        name: 2 x Kaffee
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_espresso_heute
        name: 2 x Espresso
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_ristretto_heute
        name: 2 x Ristretto
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_heisswasser_heute
        name: Heißwasser
        statistics:
          type: max
          period: day
          align: start
