      heading: Pflege
      icon: mdi:wrench-outline
      heading_style: title
    - grid_options:
        columns: 6
      type: gauge
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_cleaning
      name: Reinigung
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 80
        red: 95
    - grid_options:
        columns: 6
      type: gauge
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_decalc
      name: Entkalken
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 80
        red: 95
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_count_cleaning
      name: Reinigungen
      icon: mdi:spray-bottle
