      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_kaffee') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Espresso heute
    unique_id: jura_we6_espresso_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_espresso') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_espresso') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Ristretto heute
    unique_id: jura_we6_ristretto_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_ristretto') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_ristretto') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Kaffee heute
    unique_id: jura_we6_2_x_kaffee_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_2_coffee') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_2_x_kaffee') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Espresso heute
    unique_id: jura_we6_2_x_espresso_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_2_espressi') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_2_x_espresso') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Ristretto heute
    unique_id: jura_we6_2_x_ristretto_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_2_ristretti') %}
