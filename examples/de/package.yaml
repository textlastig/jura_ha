###############################################################################
# examples/de/package.yaml
# Tageszähler, Zubereiten-Skript und Nullpunkt-Automation für das Dashboard
# examples/de/dashboard.yaml (JURA WE6, textlastig/jura_ha, HA auf Deutsch).
#
# Tageszähler ohne Interpolation: Beim ersten Verbinden des Tages drückt die
# Automation "Statistik aktualisieren" und speichert die Zähler als
# Nullpunkt. "Bezüge heute" = aktueller Stand minus Nullpunkt. Bezüge, die
# ohne Messung entstehen (Home Assistant, Bluetooth-Proxy oder Bluetooth
# aus, Maschine vor der nächsten Abfrage ausgeschaltet), zählen in den
# Gesamtzählern, werden aber keinem Tag zugeordnet.
#
# 1. Jedes "jura_we6_xxxxxxxxxxxx" durch das eigene Entitäts-Präfix ersetzen.
# 2. Packages einmalig in configuration.yaml einschalten:
#      homeassistant:
#        packages: !include_dir_named packages
# 3. Datei als /config/packages/jura_kaffee.yaml speichern, Konfiguration
#    prüfen, Home Assistant neu starten.
# 4. Optional: Helfer "Jura Nullpunkt …" ausblenden.
###############################################################################

input_datetime:
  jura_tageszahler_referenz:
    name: Jura Tageszähler Referenz
    has_date: true
    has_time: true
    icon: mdi:calendar-clock
input_number:
  jura_nullpunkt_gesamt:
    name: Jura Nullpunkt Gesamt
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_kaffee_spezial:
    name: Jura Nullpunkt Kaffee Spezial
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_kaffee:
    name: Jura Nullpunkt Kaffee
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_espresso:
    name: Jura Nullpunkt Espresso
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_ristretto:
    name: Jura Nullpunkt Ristretto
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_2_x_kaffee:
    name: Jura Nullpunkt 2 x Kaffee
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_2_x_espresso:
    name: Jura Nullpunkt 2 x Espresso
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_2_x_ristretto:
    name: Jura Nullpunkt 2 x Ristretto
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_nullpunkt_heisswasser:
    name: Jura Nullpunkt Heißwasser
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
template:
- sensor:
  - name: Jura WE6 Gesamt heute
    unique_id: jura_we6_gesamt_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_total_product') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_gesamt') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Kaffee Spezial heute
    unique_id: jura_we6_kaffee_spezial_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_tageszahler_referenz') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_nullpunkt_kaffee_spezial') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Kaffee heute
    unique_id: jura_we6_kaffee_heute
    state_class: measurement
    icon: mdi:coffee
    state: |
