###############################################################################
# examples/en/package.yaml
# Daily counters, brew script and zero-point automation for the dashboard
# examples/en/dashboard.yaml (JURA WE6, textlastig/jura_ha, HA in English).
#
# Daily counters without interpolation: on the first connection of the day
# the automation presses "Refresh statistics" and stores the counters as the
# zero point. "Products today" = current counter minus zero point. Products
# made while no reading was possible (Home Assistant, Bluetooth proxy or
# Bluetooth down, machine switched off before the next poll) are counted in
# the total counters but not assigned to any day.
#
# 1. Replace every "jura_we6_xxxxxxxxxxxx" with your entity prefix.
# 2. Enable packages once in configuration.yaml:
#      homeassistant:
#        packages: !include_dir_named packages
# 3. Save this file as /config/packages/jura_coffee.yaml, check the
#    configuration, restart Home Assistant.
# 4. Optional: hide the "Jura zero point …" helpers.
###############################################################################

input_datetime:
  jura_daily_counter_reference:
    name: Jura daily counter reference
    has_date: true
    has_time: true
    icon: mdi:calendar-clock
input_number:
  jura_zero_point_total:
    name: Jura zero point Total
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_special_coffee:
    name: Jura zero point Special coffee
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_coffee:
    name: Jura zero point Coffee
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_espresso:
    name: Jura zero point Espresso
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_ristretto:
    name: Jura zero point Ristretto
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_2_x_coffee:
    name: Jura zero point 2 x Coffee
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_2_x_espresso:
    name: Jura zero point 2 x Espresso
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_2_x_ristretto:
    name: Jura zero point 2 x Ristretto
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
  jura_zero_point_hot_water:
    name: Jura zero point Hot water
    min: 0
    max: 10000000
    step: 1
    mode: box
    icon: mdi:numeric-0-box-outline
template:
- sensor:
  - name: Jura WE6 Total today
    unique_id: jura_we6_total_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_total_product') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_total') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Special coffee today
    unique_id: jura_we6_special_coffee_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_special_coffee') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Coffee today
    unique_id: jura_we6_coffee_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_coffee') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_coffee') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Espresso today
    unique_id: jura_we6_espresso_today
