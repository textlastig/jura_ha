      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_espresso') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_espresso') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 Ristretto today
    unique_id: jura_we6_ristretto_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_ristretto') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_ristretto') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Coffee today
    unique_id: jura_we6_2_x_coffee_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_2_coffee') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_2_x_coffee') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Espresso today
    unique_id: jura_we6_2_x_espresso_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_2_espressi') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_2_x_espresso') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
  - name: Jura WE6 2 x Ristretto today
    unique_id: jura_we6_2_x_ristretto_today
    state_class: measurement
    icon: mdi:coffee
