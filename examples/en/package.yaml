  - name: Jura WE6 Hot water today
    unique_id: jura_we6_hot_water_today
    state_class: measurement
    icon: mdi:coffee
    state: |
      {% set ref = states('input_datetime.jura_daily_counter_reference') %}
      {% set src = states('sensor.jura_we6_xxxxxxxxxxxx_product_hotwater_portionnormal') %}
      {% if ref[:10] != now().date() | string %}0
      {% elif is_number(src) %}{{ [0, (src | float - states('input_number.jura_zero_point_hot_water') | float(0)) | int] | max }}
      {% elif is_number(this.state) %}{{ this.state | int }}
      {% else %}0{% endif %}
script:
  jura_we6_brew:
    alias: Jura WE6 brew
    icon: mdi:coffee-maker
    description: Selects a product on the Jura WE6 with its default settings and starts it. For the coffee machine dashboard.
    mode: single
    fields:
      product:
        name: Product
        description: Name as in the product list, e.g. Special coffee
        required: true
        example: Special coffee
        selector:
          text: {}
    sequence:
    - action: select.select_option
      target:
        entity_id: select.jura_we6_xxxxxxxxxxxx_product
      data:
        option: '{{ product }}'
    - delay:
        seconds: 1
    - action: button.press
      target:
        entity_id: button.jura_we6_xxxxxxxxxxxx_make
automation:
- id: jura_daily_counter_zero_point
  alias: Jura daily counter zero point
  description: 'First reading of the day: on connecting to the Jura WE6, read the counters at once and store them as the zero
    point of the daily counters. Products made before the first reading (no connection, machine switched off) are deliberately
    not assigned to any day.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.jura_we6_xxxxxxxxxxxx_connection
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ states(''input_datetime.jura_daily_counter_reference'')[:10] != now().date() | string }}'
  actions:
  - action: button.press
    target:
      entity_id: button.jura_we6_xxxxxxxxxxxx_refresh_stats
  - condition: template
    value_template: '{{ is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_total_product'')) and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special''))
      and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_coffee'')) and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_espresso''))
      and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_ristretto'')) and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_coffee''))
      and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_espressi'')) and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_ristretti''))
      and is_number(states(''sensor.jura_we6_xxxxxxxxxxxx_product_hotwater_portionnormal'')) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_total
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_total_product'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_special_coffee
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_coffee
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_coffee'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_espresso
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_espresso'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_ristretto
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_ristretto'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_2_x_coffee
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_coffee'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_2_x_espresso
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_espressi'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_2_x_ristretto
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_2_ristretti'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jura_zero_point_hot_water
    data:
      value: '{{ states(''sensor.jura_we6_xxxxxxxxxxxx_product_hotwater_portionnormal'') | int }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.jura_daily_counter_reference
    data:
      timestamp: '{{ now().timestamp() }}'
