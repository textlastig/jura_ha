      tap_action:
        action: perform-action
        perform_action: script.jura_we6_brew
        data:
          product: Coffee
        confirmation:
          text: Brew Coffee?
      icon_tap_action:
        action: perform-action
        perform_action: script.jura_we6_brew
        data:
          product: Coffee
        confirmation:
          text: Brew Coffee?
      hold_action:
        action: more-info
    - type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special
