      heading_style: title
    - grid_options:
        columns: 12
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_total_product
      name: Total
      icon: mdi:coffee
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_ristretto
      name: Ristretto
      icon: mdi:coffee-outline
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_espresso
      name: Espresso
