        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_hotwater_portionnormal
      name: Hot water
      icon: mdi:kettle
      color: brown
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Products per day
      icon: mdi:chart-bar
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      all_series_config:
        curve: stepline
        stroke_width: 2
        unit: products
        extend_to: now
        transform: 'return Number(x) > 0 ? Number(x) : null;'
        show:
          legend_value: false
      apex_config:
        chart:
          height: 320
        markers:
          size: 5
        legend:
          position: bottom
        yaxis:
          min: 0
          forceNiceScale: true
          decimalsInFloat: 0
      header:
        show: true
        title: Today
        show_states: false
      graph_span: 1d
      span:
        start: day
      series:
      - entity: sensor.jura_we6_special_coffee_today
        name: Special coffee
      - entity: sensor.jura_we6_coffee_today
        name: Coffee
      - entity: sensor.jura_we6_espresso_today
        name: Espresso
      - entity: sensor.jura_we6_ristretto_today
        name: Ristretto
      - entity: sensor.jura_we6_2_x_coffee_today
        name: 2 x Coffee
      - entity: sensor.jura_we6_2_x_espresso_today
        name: 2 x Espresso
      - entity: sensor.jura_we6_2_x_ristretto_today
        name: 2 x Ristretto
      - entity: sensor.jura_we6_hot_water_today
        name: Hot water
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      all_series_config:
        curve: stepline
        stroke_width: 2
        unit: products
        extend_to: false
        transform: 'return Number(x) > 0 ? Number(x) : null;'
        show:
          legend_value: false
      apex_config:
        chart:
          height: 320
        markers:
          size: 5
        legend:
          position: bottom
        yaxis:
          min: 0
          forceNiceScale: true
          decimalsInFloat: 0
        xaxis:
          tickAmount: 7
      header:
        show: true
        title: Last 7 days
        show_states: false
      graph_span: 7d
      span:
        start: day
        offset: -6d
      series:
      - entity: sensor.jura_we6_special_coffee_today
        name: Special coffee
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_coffee_today
        name: Coffee
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_espresso_today
        name: Espresso
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_ristretto_today
        name: Ristretto
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_coffee_today
        name: 2 x Coffee
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_espresso_today
        name: 2 x Espresso
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_2_x_ristretto_today
        name: 2 x Ristretto
        statistics:
          type: max
          period: day
          align: start
      - entity: sensor.jura_we6_hot_water_today
        name: Hot water
        statistics:
          type: max
          period: day
          align: start
