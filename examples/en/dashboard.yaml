    - type: heading
      heading: Custom
      heading_style: subtitle
    - grid_options:
        columns: 12
      type: tile
      entity: select.jura_we6_xxxxxxxxxxxx_product
      name: Product
      icon: mdi:coffee
      color: brown
      features:
      - type: select-options
      features_position: inline
      hide_state: true
    - grid_options:
        columns: 6
      type: tile
      entity: select.jura_we6_xxxxxxxxxxxx_coffee_strength
      name: Strength
      icon: mdi:coffee-maker-outline
      color: brown
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: select.jura_we6_xxxxxxxxxxxx_coffee_strength
        state_not: unavailable
      hide_state: true
    - grid_options:
        columns: 6
      type: tile
      entity: select.jura_we6_xxxxxxxxxxxx_temperature
      name: Temperature
      icon: mdi:thermometer
      color: brown
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: select.jura_we6_xxxxxxxxxxxx_temperature
        state_not: unavailable
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: number.jura_we6_xxxxxxxxxxxx_water_amount
      name: Water amount
      icon: mdi:water
      color: brown
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: number.jura_we6_xxxxxxxxxxxx_water_amount
        state_not: unavailable
    - grid_options:
        columns: 12
      type: tile
      entity: button.jura_we6_xxxxxxxxxxxx_make
      name: Brew
      icon: mdi:play-circle-outline
      color: green
      hide_state: true
      tap_action: &id001
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jura_we6_xxxxxxxxxxxx_make
        confirmation:
          text: Brew now?
      icon_tap_action: *id001
      visibility:
      - condition: state
        entity: button.jura_we6_xxxxxxxxxxxx_make
        state_not: unavailable
  - type: grid
    cards:
    - type: heading
      heading: Maintenance
      icon: mdi:wrench-outline
      heading_style: title
    - grid_options:
        columns: 6
      type: gauge
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_cleaning
      name: Cleaning
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 80
        red: 95
    - grid_options:
        columns: 6
      type: gauge
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_decalc
      name: Descaling
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 80
        red: 95
      visibility:
      - condition: state
        entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_decalc
        state_not: unavailable
    - grid_options:
        columns: 6
      type: gauge
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_filterchange
      name: Filter
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 80
        red: 95
      visibility:
      - condition: state
        entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_filterchange
        state_not: unavailable
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_count_cleaning
      name: Cleanings
      icon: mdi:spray-bottle
      color: blue-grey
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_count_decalc
      name: Descalings
      icon: mdi:water-sync
      color: blue-grey
      visibility:
      - condition: state
        entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_decalc
        state_not: unavailable
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_count_filterchange
      name: Filter changes
      icon: mdi:air-filter
      color: blue-grey
      visibility:
      - condition: state
        entity: sensor.jura_we6_xxxxxxxxxxxx_maintenance_percent_filterchange
        state_not: unavailable
  - type: grid
    cards:
    - type: heading
      heading: Products today
      icon: mdi:coffee
      heading_style: title
    - grid_options:
        columns: 12
      type: tile
      entity: sensor.jura_we6_total_today
      name: Total
      icon: mdi:coffee
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_ristretto_today
      name: Ristretto
      icon: mdi:coffee-outline
