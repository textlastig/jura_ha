      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_2_ristretti
      name: 2 x Ristretto
      icon: mdi:coffee-outline
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_2_espressi
      name: 2 x Espresso
      icon: mdi:coffee-outline
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_2_coffee
      name: 2 x Coffee
      icon: mdi:coffee-outline
      color: brown
