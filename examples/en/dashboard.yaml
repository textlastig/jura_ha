###############################################################################
# examples/en/dashboard.yaml
# Dashboard "Coffee machine" for a JURA WE6 with textlastig/jura_ha.
# Home Assistant language: English (product names must match the
# integration's product list).
#
# 1. Install jura_ha and the card apexcharts-card (HACS or Marketplace).
# 2. Roll out examples/en/package.yaml first (daily counters, brew script).
# 3. Replace every "jura_we6_xxxxxxxxxxxx" with your entity prefix,
#    e.g. jura_we6_d0123456789a (Settings → Entities, search "jura").
# 4. Settings → Dashboards → Add dashboard → "New dashboard from scratch",
#    open it → Edit → ⋮ → Raw configuration editor, paste this file, save.
# Other machines: remove tiles of products your machine does not offer.
###############################################################################

title: Coffee machine
views:
- title: Jura WE6
  path: we6
  icon: mdi:coffee-maker
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: binary_sensor.jura_we6_xxxxxxxxxxxx_connection
    name: Bluetooth
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.jura_we6_xxxxxxxxxxxx_total_product
    name: Device
    show_name: true
    show_state: false
    show_icon: true
    icon: mdi:coffee-maker-outline
    tap_action:
      action: more-info
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Alerts
      icon: mdi:bell-outline
      heading_style: title
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_fill_water
      name: Fill water tank
      icon: mdi:water-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_fill_water
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_no_beans
      name: Fill beans
      icon: mdi:coffee-off
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_no_beans
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_grounds
      name: Empty grounds container
      icon: mdi:delete-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_grounds
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_tray
      name: Empty drip tray
      icon: mdi:tray-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_tray
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_tray
      name: Drip tray missing
      icon: mdi:tray
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_tray
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_coffee_bin
      name: Grounds container missing
      icon: mdi:delete-empty
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_coffee_bin
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_alert
      name: Clean the machine
      icon: mdi:spray-bottle
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_alert
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_alert
      name: Replace filter
      icon: mdi:filter-variant-remove
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_alert
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_alert
      name: Descale the machine
      icon: mdi:water-alert
      color: red
      vertical: false
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_alert
        state: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_info
      name: Descale soon
      icon: mdi:water-alert-outline
      color: amber
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_info
        state: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_alert
        state_not: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_info
      name: Clean soon
      icon: mdi:spray-bottle
      color: amber
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_info
        state: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_alert
        state_not: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_info
      name: Change filter soon
      icon: mdi:air-filter
      color: amber
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_info
        state: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_alert
        state_not: 'on'
      hide_state: true
    - grid_options:
        columns: 12
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_alerts
      name: All good
      icon: mdi:check-circle-outline
      color: green
      hide_state: true
      visibility:
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_fill_water
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_no_beans
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_grounds
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_empty_tray
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_tray
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_alert
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_alert
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_alert
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_decalc_info
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_insert_coffee_bin
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_cleaning_info
        state_not: 'on'
      - condition: state
        entity: binary_sensor.jura_we6_xxxxxxxxxxxx_alert_filter_info
        state_not: 'on'
