      icon: mdi:cup
      color: brown
      vertical: true
      hide_state: true
      grid_options:
        columns: 4
        rows: 2
      tap_action:
        action: perform-action
        perform_action: script.jura_we6_brew
        data:
          product: 2 x Coffee
        confirmation:
