      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_coffee
      name: Coffee
      icon: mdi:coffee-outline
      color: brown
    - grid_options:
        columns: 6
      type: tile
      entity: sensor.jura_we6_xxxxxxxxxxxx_product_1_coffee_special
      name: Special coffee
      icon: mdi:coffee-outline
      color: brown
    - grid_options:
